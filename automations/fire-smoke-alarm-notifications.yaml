alias: 🔥🔥 FIRE SMOKE ALARM Notifications 🔥🔥
description: >
  # 🔥🔥 FIRE SMOKE ALARM Notifications 🔥🔥  

  This automation is triggered when any of the listed Smoke Alarms are triggered
  to a stae of "on". It will then send a notification to the listed phones, they
  must have the HA Companion App installed. A visualk notification is sent also
  an alarm will be triggered at top volume for the channel: fire_alarm_stream.
  You can change the channels notification ring by going to the HA Companion App
  > Settings > Companion app >  scroll down to Notifications > Notification
  channels and choose the channel you created. Edit it and change  the sound you
  want to use.

triggers:
  - trigger: state
    entity_id:
      - binary_sensor.smoke_alarm_garage_ias_zone
      - binary_sensor.smoke_alarm_hallway
      - binary_sensor.heiman_smokesensor_ef_3_0_smoke
      - binary_sensor.smoke_alarm_lounge_ias_zone
      - binary_sensor.smoke_alarm_kitchen_smoke
      - binary_sensor.smoke_alarm_master_bedroom_2_ias_zone
      - binary_sensor.smoke_alarm_upper_hallway_smoke_2
    to: "on"
conditions: []
actions:
  - action: notify.mobile_app_sm_s901e
    metadata: {}
    data:
      message: command_ringer_mode
      data:
        command: normal
        priority: high
  - action: notify.mobile_app_sm_s901e
    data:
      title: 🔥🔥 FIRE ALARM 🔥🔥
      message: "{{ trigger.to_state.attributes.friendly_name }} has detected smoke!"
      data:
        ttl: 0
        tag: Fire Alarm
        priority: high
        vibrationPattern: 100, 1000, 100, 1000, 100
        channel: fire_alarm_stream
        media_stream: alarm_stream_max
  - action: notify.mobile_app_claudias_phone
    metadata: {}
    data:
      title: 🔥🔥 FIRE ALARM 🔥🔥
      message: "{{ trigger.to_state.attributes.friendly_name }} has detected smoke!"
mode: single
